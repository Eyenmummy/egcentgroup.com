<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Login | Egcent Property</title><link rel="icon" href="images/egcent-logo.png" type="image/png"><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9626860167330937" crossorigin="anonymous"></script></head>
<body>
  <h2>Agent Login</h2>
  <form id="loginForm">
    Email: <input type="email" id="email"><br>
    Password: <input type="password" id="password"><br>
    <button type="submit">Login</button>
  </form>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const res = await fetch('/.netlify/functions/login', {
        method: 'POST',
        body: JSON.stringify({ email, password }),
        headers: { 'Content-Type': 'application/json' }
      });
      const data = await res.json();
      if (data.token) {
        localStorage.setItem('token', data.token);
        alert("Logged in! Redirecting...");
        window.location.href = "upload.html";
      } else {
        alert("Login failed: " + data.error);
      }
    });
  </script>
</body>
</html>
