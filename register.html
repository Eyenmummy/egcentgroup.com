<!DOCTYPE html>
<html>
<body>
  <h2>Agent Register</h2>
  <form id="registerForm">
    Full name: <input type="text" id="name" required><br>
    Email: <input type="email" id="email" required><br>
    Password: <input type="password" id="password" required><br>
    Confirm Password: <input type="password" id="confirm" required><br>
    <button type="submit">Register</button>
  </form>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;

      if (password !== confirm) return alert('Passwords do not match');

      try {
        const res = await fetch('/.netlify/functions/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });
        const data = await res.json();
        if (data.token) {
          localStorage.setItem('token', data.token);
          alert('Registered and signed in! Redirecting...');
          window.location.href = 'upload.html';
        } else {
          alert('Registration failed: ' + (data.error || JSON.stringify(data)));
        }
      } catch (err) {
        alert('Registration error: ' + err.message);
      }
    });
  </script>
</body>
</html>
